<body>
<!DOCTYPE html>
<title></title>
    <div class="titulo">
      <h1 align="center">&nbsp;</h1>
      <h1 align="center">&nbsp;</h1>
      <h1 align="center">Reservas en LUZIOR ROYALE</h1>
        <p align="center">Completa el siguiente formulario para realizar tu reserva.</p>
        <p align="center">&nbsp;</p>
        <p align="center">&nbsp;</p>
        <p align="center">&nbsp;</p>
        <p align="center">&nbsp;</p>
</div>

    <div class="formulario-reserva">
        <form action="#" method="post">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>

            <label for="fecha-checkin">Fecha de Check-in:</label>
            <input type="date" id="fecha-checkin" name="fecha-checkin" required>

            <label for="fecha-checkout">Fecha de Check-out:</label>
            <input type="date" id="fecha-checkout" name="fecha-checkout" required>

            <label for="habitacion">Tipo de Habitación:</label>
            <select id="habitacion" name="habitacion" required>
                <option value="deluxe">Habitación Deluxe</option>
                <option value="suite-ejecutiva">Suite Ejecutiva</option>
                <option value="habitacion-familiar">Habitación Familiar</option>
                <option value="habitacion-standard">Habitación Standard</option>
            </select>

            <button type="submit">Reservar</button>
      </form>
</div>
</body>
</html>
</body>
